name: Validate
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.7-alpine
        env:
          POSTGRES_USER: wa
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: wa
        ports: ['5432:5432']
        options: --health-cmd 'pg_isready -U wa' --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7.4.7-alpine
        ports: ['6379:6379']
        options: --health-cmd 'redis-cli ping' --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - run: npm install --global pnpm@11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Prepare isolated test settings
        run: |
          python3 infrastructure/scripts/init-local.py
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env')
          values=dict(line.split('=',1) for line in p.read_text().splitlines() if '=' in line)
          values['DATABASE_URL']='postgresql://wa:ci-only-password@127.0.0.1:5432/wa'
          p.write_text(''.join(k+'='+v+'\n' for k,v in values.items()))
          PY
      - run: python3 -m unittest discover -s tests/operations -p 'test_*.py'
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:integration
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - run: pnpm audit --prod --audit-level high
      - name: Reject tracked secret files
        run: |
          if git ls-files | rg '(^|/)(\.env|.*\.(pem|key))$'; then exit 1; fi
